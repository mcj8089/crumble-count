<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Crumble Count | pipygames.com</title>
<meta name="description" content="A one-button grid puzzle: hop from stack to stack, stomp the numbers down to zero, and clear every block on the board." />
<meta name="theme-color" content="#f7a072" />
<link rel="icon" href="data:," />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="pipygames.com" />
<meta property="og:title" content="Crumble Count — Hop the Stacks to Zero" />
<meta property="og:description" content="Forty one-button grid puzzles. Stomp every candy stack down to zero without falling out of the board." />
<meta property="og:url" content="https://pipygames.com/games/crumble-count/" />
<meta property="og:image" content="https://pipygames.com/games/crumble-count/poster.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="800" />
<meta property="og:image:height" content="450" />
<meta property="og:locale" content="en_US" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Crumble Count — Hop the Stacks to Zero" />
<meta name="twitter:description" content="Forty one-button grid puzzles. Stomp every candy stack down to zero without falling out of the board." />
<meta name="twitter:image" content="https://pipygames.com/games/crumble-count/poster.jpg" />

<link rel="stylesheet" href="styles.css" />

<!-- 广告 SDK：唯一合法形态是这条线上外链（必须排在 ES Module 入口之前）。
     defer 让它不挡解析，也不会因外网慢而白屏；加载失败时 src/core/ads.js 自动降级、广告入口隐藏。 -->
<script src="https://pipygames.com/sdk/pipysdk.min.js" data-app-id="crumble-count" defer></script>

<script type="importmap">
{
  "imports": {
    "config/": "./config/",
    "core/": "./src/core/",
    "art/": "./src/art/",
    "game/": "./src/game/",
    "ui/": "./src/ui/"
  }
}
</script>
</head>
<body>
<!-- 留白兜底：非 16:9 屏幕（4:3 平板 / 21:9 带鱼屏）stage 两侧会有空隙，用主题色光晕填充而不是黑边 -->
<div id="backdrop" class="backdrop" aria-hidden="true"></div>
<!-- 渲染层：铺满整个视口，背景可以出血到屏幕边缘，玩法层在内部居中成 16:9 -->
<div id="game-root" class="game-root"></div>

<!-- 交互层：逻辑坐标 1280×720，整体等比缩放（HUD/按钮/引导都在这里） -->
<div id="stage" class="stage">

  <div id="ui-root" class="ui-root">
    <!-- ===== HUD ===== -->
    <div class="hud" id="hud" hidden>
      <div class="hud__group">
        <div class="chip chip--level"><span class="chip__label" data-i18n="hud.level">Level</span><span class="chip__value" id="hud-level">1</span></div>
        <div class="gauge" id="hud-gauge"><em class="gauge__fill" id="hud-gauge-fill"></em></div>
      </div>
      <div class="hud__group">
        <div class="chip chip--moves" id="chip-moves">
          <span class="chip__label" data-i18n="hud.moves">Moves</span>
          <span class="chip__value" id="hud-moves">0</span><span class="chip__max" id="hud-moves-max">/0</span>
        </div>
        <div class="chip chip--coin">
          <span class="coin-ico" aria-hidden="true"></span><span class="chip__value" id="hud-coins">0</span>
        </div>
        <div class="corner-actions">
          <button class="btn btn--icon" id="btn-sound" type="button">
            <span class="btn__icon ico-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg></span>
            <span class="btn__icon ico-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m17 9 4 6"/><path d="m21 9-4 6"/></svg></span>
          </button>
          <button class="btn btn--icon" id="btn-pause" type="button">
            <span class="btn__icon"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg></span>
          </button>
        </div>
      </div>
    </div>

    <!-- ===== 本关机制说明（开局自动出现，第一次操作后收起） ===== -->
    <div class="objective" id="objective"><span class="objective__dot" aria-hidden="true"></span><span id="objective-text"></span></div>

    <div class="banner" id="banner"></div>

    <!-- ===== 新手引导：底部按键图例 ===== -->
    <div class="keybar" id="keybar">
      <span class="keybar__item">
        <span class="keycap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></span>
        <span class="keycap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
        <span id="keybar-move">Move</span>
      </span>
    </div>

    <!-- ===== 新手引导：游戏内手势提示 ===== -->
    <div class="hint" id="hint">
      <span class="hint__hand" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V6a2 2 0 1 1 4 0v5"/><path d="M13 11V5a2 2 0 1 1 4 0v6"/><path d="M17 11V7a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0"/></svg>
      </span>
      <span class="hint__text" id="hint-text">Move with left and right</span>
    </div>

    <!-- ===== 触屏控件 ===== -->
    <div class="touch-controls" id="touch">
      <button class="pad__btn" id="pad-left" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="pad__btn" id="pad-right" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ===== 主菜单 ===== -->
    <div class="overlay is-open" id="ov-menu">
      <div class="panel panel--menu">
        <h1 class="game-title" id="menu-title">Crumble Count</h1>
        <p class="panel__desc" data-i18n="menu.tagline">Hop the stacks to zero</p>
        <div class="btn-row">
          <button class="btn btn--primary" id="btn-play" type="button">Play</button>
          <button class="btn btn--ghost" id="btn-levels" type="button" data-i18n="menu.levels">Levels</button>
        </div>
        <div class="menu-foot"><span class="coin-ico" aria-hidden="true"></span><b id="menu-coins">0</b></div>
      </div>
    </div>

    <!-- ===== 选关 ===== -->
    <div class="overlay" id="ov-levels">
      <div class="panel panel--levels">
        <h2 class="panel__title" data-i18n="levels.title">Levels</h2>
        <p class="panel__desc" data-i18n="levels.hint">Pick any level you have reached</p>
        <div class="level-grid" id="level-grid"></div>
        <div class="btn-row">
          <button class="btn btn--ghost" id="btn-levels-back" type="button" data-i18n="btn.back">Back</button>
        </div>
      </div>
    </div>

    <!-- ===== 暂停 ===== -->
    <div class="overlay" id="ov-pause">
      <div class="panel">
        <h2 class="panel__title" data-i18n="pause.title">Paused</h2>
        <div class="btn-row">
          <button class="btn btn--primary" id="btn-resume" type="button" data-i18n="btn.resume">Resume</button>
        </div>
        <div class="btn-row btn-row--sub">
          <button class="btn btn--ghost" id="btn-restart" type="button" data-i18n="btn.replay">Replay</button>
          <button class="btn btn--ghost" id="btn-pause-home" type="button" data-i18n="btn.quit">Menu</button>
        </div>
      </div>
    </div>

    <!-- ===== 过关结算 ===== -->
    <div class="overlay" id="ov-clear">
      <div class="panel panel--clear">
        <h2 class="panel__title" data-i18n="clear.title">Level cleared</h2>
        <div class="stars" id="clear-stars">
          <i class="star"></i><i class="star"></i><i class="star"></i>
        </div>
        <div class="panel__stats">
          <div class="stat"><span class="stat__label" data-i18n="clear.moves">Moves</span><span class="stat__value" id="clear-moves">0</span></div>
          <div class="stat"><span class="stat__label" data-i18n="clear.par">Best</span><span class="stat__value" id="clear-par">0</span></div>
          <div class="stat"><span class="stat__label" data-i18n="clear.coins">Coins</span><span class="stat__value" id="clear-coins">0</span></div>
        </div>
        <div class="btn-row">
          <button class="btn btn--primary" id="btn-next" type="button" data-i18n="btn.next">Next level</button>
        </div>
        <div class="btn-row btn-row--sub">
          <button class="btn btn--ghost" id="btn-replay" type="button" data-i18n="btn.replay">Replay</button>
          <button class="btn btn--ghost" id="btn-clear-home" type="button" data-i18n="btn.home">Home</button>
        </div>
        <button class="btn btn--ad" id="btn-double" type="button" data-i18n="btn.double">Watch ad · x2 coins</button>
      </div>
    </div>

    <!-- ===== 失败 / 复活 ===== -->
    <div class="overlay" id="ov-fail">
      <div class="panel panel--fail">
        <h2 class="panel__title" id="fail-title" data-i18n="fail.title">Out of moves</h2>
        <p class="panel__desc" id="fail-desc" data-i18n="fail.desc">Every move counts on this board.</p>
        <button class="btn btn--ad" id="btn-revive" type="button" data-i18n="btn.revive">Watch ad · 8 more moves</button>
        <div class="btn-row">
          <button class="btn btn--primary" id="btn-retry" type="button" data-i18n="btn.retry">Retry</button>
          <button class="btn btn--ghost" id="btn-fail-home" type="button" data-i18n="btn.home">Home</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 开屏：pipygames.com + 同风格加载动画 + 真实百分比 ===== -->
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot__card">
    <div class="boot__brand">pipygames<span>.com</span></div>
    <div class="boot__orb" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="boot__bar"><em id="boot-fill"></em></div>
    <div class="boot__row">
      <span class="boot__pct"><b id="boot-pct">0</b>%</span>
      <span class="boot__tip" id="boot-tip" data-i18n="boot.tip">Loading…</span>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
